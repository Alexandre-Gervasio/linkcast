<!doctype html><meta charset="utf-8" /><meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>
<title>LinkCast: enviar</title>
<style>
  body {
    margin: 0;
    background: #12151c;
    color: #e8ebf2;
    font: 16px system-ui;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  button {
    padding: 14px;
    border-radius: 10px;
    border: 0;
    background: #3ecfd1;
    color: #06292a;
    font: inherit;
    font-weight: 600;
  }
  video {
    width: 100%;
    border-radius: 10px;
    background: #000;
  }
</style>

<button id="cam">Enviar câmera</button
><button id="scr">Compartilhar tela</button>
<video id="v" autoplay muted playsinline></video>
<div id="m"></div>
<div>
  Use o mesmo Wi-Fi do computador que está transmitindo. Na primeira visita,
  abra o aviso de certificado HTTPS e escolha a opção para continuar. Se a
  câmera não abrir, permita câmera e microfone nas configurações do navegador.
</div>

<script src="rtc.js"></script>
<script>
  const room = new URLSearchParams(location.search).get("room") || "main";
  const v = document.getElementById("v"),
    m = document.getElementById("m");
  let pc = null,
    started = false;
  function start(stream) {
    v.srcObject = stream;
    if (started) return;
    started = true;
    Signal("wss://" + location.host, {
      open: (s) => {
        if (pc) pc.close();
        pc = null;
        s.send({ t: "join", role: "guest", room });
      },
      error: (e) => {
        m.textContent = e.message + " Verifique o certificado e a rede Wi-Fi.";
      },
      messageError: (e) => {
        m.textContent = "Falha ao negociar vídeo: " + e.message;
      },
      msg: async (d, s) => {
        if (d.t === "joined") {
          pc = new RTCPeerConnection(RTC_CONFIG);
          pc.onicecandidate = (e) =>
            e.candidate &&
            s.send({ t: "signal", to: "host", data: { ice: e.candidate } });
          pc.oniceconnectionstatechange = () => {
            if (pc.iceConnectionState === "failed")
              m.textContent =
                "Falha de conexão. Confirme que celular e computador estão no mesmo Wi-Fi e que o Wi-Fi permite comunicação entre dispositivos.";
          };
          await addHighQuality(v.srcObject);
          s.send({
            t: "signal",
            to: "host",
            data: { sdp: pc.localDescription },
          });
          m.textContent = "Enviando para o host.";
        }
        if (d.t === "signal" && pc)
          await applySignal(pc, d.data, (x) =>
            s.send({ t: "signal", to: "host", data: x }),
          );
      },
    });
  }
  async function addHighQuality(stream) {
    const quality = [];
    stream.getTracks().forEach((track) => {
      const sender = pc.addTrack(track, stream);
      if (track.kind === "video") quality.push(setHighQuality(sender));
    });
    await Promise.all(
      quality.map((configure) =>
        configure.catch((error) => {
          m.textContent =
            "Vídeo conectado, mas não foi possível aplicar a taxa máxima de qualidade: " +
            error.message;
        }),
      ),
    );
    await pc.setLocalDescription(await pc.createOffer());
  }
  cam.onclick = async () => {
    try {
      start(
        await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            frameRate: { ideal: 60 },
          },
          audio: true,
        }),
      );
      m.textContent = "Conectando ao computador…";
    } catch (error) {
      m.textContent =
        "Não foi possível abrir câmera/microfone: " + error.message;
    }
  };
  scr.onclick = async () => {
    try {
      start(
        await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 60 } },
          audio: true,
        }),
      );
      m.textContent = "Conectando ao computador…";
    } catch (error) {
      m.textContent = "Não foi possível compartilhar a tela: " + error.message;
    }
  };
</script>
